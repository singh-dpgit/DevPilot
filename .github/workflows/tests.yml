
name: DevPilot Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: devpilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit Tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/devpilot
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          GROQ_API_KEY: test-key
          GITHUB_CLIENT_ID: test-client-id
          GITHUB_CLIENT_SECRET: test-client-secret
          TOKEN_ENCRYPTOR_PASSWORD: test-encryption-password
          TOKEN_ENCRYPTOR_SALT: 1234567890abcdef
        run: mvn -B test
